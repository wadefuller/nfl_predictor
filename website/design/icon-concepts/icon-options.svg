<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">NFL Predictor website icon concepts</title>
  <desc id="desc">Four favicon concepts shown large and at common browser tab sizes.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <g id="signal">
      <rect x="3" y="3" width="58" height="58" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <path d="M17 16v21c0 7 6 12 15 12s15-5 15-12V16" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
      <path d="M14 41l10-9 8 5 16-18" fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="19" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="2"/>
    </g>
    <g id="dial">
      <rect x="3" y="3" width="58" height="58" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#30363d" stroke-width="7"/>
      <path d="M32 13a19 19 0 1 1-18.1 24.8" fill="none" stroke="#58a6ff" stroke-width="7" stroke-linecap="round"/>
      <path d="M32 32l11-10" fill="none" stroke="#e6edf3" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4" fill="#e6edf3"/>
    </g>
    <g id="gridiron">
      <rect x="3" y="3" width="58" height="58" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <path d="M12.5 36.5c5.4-17.1 21.7-25.4 39-19 1.2 17.9-10 31.5-28.5 32-6.5-2.5-9.8-6.8-10.5-13Z" fill="#58a6ff"/>
      <path d="M20 41c8-4 15-10 22-18" fill="none" stroke="#0d1117" stroke-width="4" stroke-linecap="round"/>
      <path d="M26.5 30.5l8 7M31 26l8 7" fill="none" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="monogram">
      <rect x="3" y="3" width="58" height="58" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <path d="M16 46V18l20 28V18" fill="none" stroke="#e6edf3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 18h6.5a9 9 0 0 1 0 18H36" fill="none" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="470" rx="28" fill="#090d13"/>
  <text x="46" y="53" fill="#e6edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">NFL Predictor · icon directions</text>
  <text x="46" y="80" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Purpose-built for clarity at 16–32px · no gradients · matches the product palette</text>

  <g transform="translate(35 110)">
    <rect width="265" height="315" rx="18" fill="#111820" stroke="#263140"/>
    <g transform="translate(91 30) scale(1.3)" filter="url(#shadow)"><use href="#signal"/></g>
    <text x="22" y="146" fill="#e6edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">01 · Signal Field</text>
    <text x="22" y="171" fill="#58a6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RECOMMENDED</text>
    <text x="22" y="200" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Football structure + forecast path.</text>
    <text x="22" y="221" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Most distinctive and product-specific.</text>
    <g transform="translate(22 252)"><use href="#signal" width="32" height="32"/><g transform="translate(50 4) scale(.375)"><use href="#signal"/></g><g transform="translate(91 8) scale(.25)"><use href="#signal"/></g></g>
    <text x="22" y="303" fill="#59636f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">32px       24px       16px</text>
  </g>

  <g transform="translate(323 110)">
    <rect width="265" height="315" rx="18" fill="#111820" stroke="#263140"/>
    <g transform="translate(91 30) scale(1.3)" filter="url(#shadow)"><use href="#dial"/></g>
    <text x="22" y="146" fill="#e6edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">02 · Probability Dial</text>
    <text x="22" y="171" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ANALYTICS-FIRST</text>
    <text x="22" y="200" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Confidence ring + model needle.</text>
    <text x="22" y="221" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Calm, precise, and dashboard-like.</text>
    <g transform="translate(22 252)"><use href="#dial" width="32" height="32"/><g transform="translate(50 4) scale(.375)"><use href="#dial"/></g><g transform="translate(91 8) scale(.25)"><use href="#dial"/></g></g>
    <text x="22" y="303" fill="#59636f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">32px       24px       16px</text>
  </g>

  <g transform="translate(611 110)">
    <rect width="265" height="315" rx="18" fill="#111820" stroke="#263140"/>
    <g transform="translate(91 30) scale(1.3)" filter="url(#shadow)"><use href="#gridiron"/></g>
    <text x="22" y="146" fill="#e6edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">03 · Gridiron Mark</text>
    <text x="22" y="171" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SPORT-FIRST</text>
    <text x="22" y="200" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Abstract football + data point.</text>
    <text x="22" y="221" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Immediate category recognition.</text>
    <g transform="translate(22 252)"><use href="#gridiron" width="32" height="32"/><g transform="translate(50 4) scale(.375)"><use href="#gridiron"/></g><g transform="translate(91 8) scale(.25)"><use href="#gridiron"/></g></g>
    <text x="22" y="303" fill="#59636f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">32px       24px       16px</text>
  </g>

  <g transform="translate(899 110)">
    <rect width="265" height="315" rx="18" fill="#111820" stroke="#263140"/>
    <g transform="translate(91 30) scale(1.3)" filter="url(#shadow)"><use href="#monogram"/></g>
    <text x="22" y="146" fill="#e6edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">04 · NP Monogram</text>
    <text x="22" y="171" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">BRAND-FIRST</text>
    <text x="22" y="200" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Compact initials with win-state dot.</text>
    <text x="22" y="221" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Feels most like a standalone product.</text>
    <g transform="translate(22 252)"><use href="#monogram" width="32" height="32"/><g transform="translate(50 4) scale(.375)"><use href="#monogram"/></g><g transform="translate(91 8) scale(.25)"><use href="#monogram"/></g></g>
    <text x="22" y="303" fill="#59636f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">32px       24px       16px</text>
  </g>
</svg>
