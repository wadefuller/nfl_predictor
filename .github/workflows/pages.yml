name: Deploy site to GitHub Pages

# GitHub Pages is RETIRED as a copy of the site (2026-11-24). It only ever
# updated when site data was committed and pushed by hand, so it drifted
# weeks behind (it was serving week 5 in week 12). The live site is deployed
# by weekly_run to Cloudflare Pages at https://nfl-predictor-mf4-cjl.pages.dev.
#
# This workflow now publishes a single redirect page
# (.github/pages-redirect/index.html) that forwards any wadefuller.github.io/
# nfl_predictor/... URL — including its #/view/season/week hash — to the same
# page on the live site. To bring back a full GitHub Pages copy instead, restore
# the npm build job from git history and add a step that pushes site data.

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.html for the site root; 404.html so any deeper path (old asset
      # or data URLs) is redirected too instead of showing GitHub's 404 page.
      - name: Assemble redirect site
        run: |
          mkdir -p _site
          cp .github/pages-redirect/index.html _site/index.html
          cp .github/pages-redirect/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
